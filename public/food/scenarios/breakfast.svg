<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="우유와 달걀, 밥으로 차린 아침 식탁">
  <title>햇살 아래 차린 간단한 아침 식탁</title>
  <defs>
    <radialGradient id="table"><stop stop-color="#f6eedc"/><stop offset="1" stop-color="#ded1b8"/></radialGradient>
    <radialGradient id="plate"><stop offset=".66" stop-color="#eae4d3"/><stop offset=".75" stop-color="#f4efe0"/><stop offset=".92" stop-color="#fffaed"/><stop offset="1" stop-color="#cfc8b6"/></radialGradient>
    <linearGradient id="cup" x2="1" y2="0"><stop stop-color="#c6d5c1" stop-opacity=".8"/><stop offset=".3" stop-color="#f5f9e9" stop-opacity=".7"/><stop offset=".78" stop-color="#dce6d3" stop-opacity=".7"/><stop offset="1" stop-color="#98af9c" stop-opacity=".65"/></linearGradient>
    <radialGradient id="yolk" cx=".42" cy=".35"><stop stop-color="#f8cf72"/><stop offset=".8" stop-color="#e9b04c"/><stop offset="1" stop-color="#d49a38"/></radialGradient>
    <linearGradient id="bowl" x2="0" y2="1"><stop stop-color="#f0ecdc"/><stop offset="1" stop-color="#d8d3bd"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="3" dy="12" stdDeviation="12" flood-color="#65573e" flood-opacity=".18"/></filter>
    <filter id="small" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#65573e" flood-opacity=".2"/></filter>
    <pattern id="linen" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#9eab8c"/><path d="M0 3h14M4 0v14" stroke="#bbc6a8" stroke-width="1" opacity=".5"/></pattern>
    <g id="grain"><ellipse rx="4" ry="2" fill="#fffbed"/><path d="M-2 0h4" stroke="#e1dcc7" stroke-width=".6"/></g>
  </defs>
  <rect width="800" height="520" fill="url(#table)"/>
  <g stroke="#bba37b" stroke-opacity=".12"><path d="M0 71h800M0 282h800M0 492h800" stroke-width="2"/><path d="M28 85q170-10 360 0M465 269q130-12 270-2M48 470q186 10 333-1" fill="none"/></g>
  <path d="M-28-10h250l349 530H289Z" fill="#fffbe9" opacity=".36"/>
  <path d="M-40 36h251l21 484H-40Z" fill="url(#linen)" transform="rotate(-10 90 260)"/>
  <path d="M33 14 119 520" stroke="#e3e8d1" stroke-width="3" opacity=".7"/>
  <ellipse cx="422" cy="292" rx="185" ry="146" fill="url(#plate)" filter="url(#shadow)"/>
  <ellipse cx="422" cy="290" rx="141" ry="105" fill="none" stroke="#d6d0bc" stroke-width="2"/>
  <!-- Soft fried eggs, with no labels or graphic copy. -->
  <g filter="url(#small)">
    <path d="M322 265c-15-17-4-45 21-48 7-27 40-38 63-20 26-5 43 16 41 38 23 16 22 45-2 58-5 27-31 35-54 24-28 12-49-8-49-24-22-1-32-15-20-28Z" fill="#fff9e7" stroke="#e3d1a6" stroke-width="2"/>
    <ellipse cx="383" cy="252" rx="32" ry="29" fill="url(#yolk)"/><path d="M367 239q10-9 22-5" fill="none" stroke="#ffe2a1" stroke-width="5" stroke-linecap="round"/>
    <path d="M417 299c-6-26 18-38 39-33 17-23 53-17 62 2 23 0 38 22 28 40 15 21 0 46-25 45-12 25-41 23-56 9-25 3-42-12-39-31-17-7-20-23-9-32Z" fill="#fff9e7" stroke="#e3d1a6" stroke-width="2"/>
    <ellipse cx="480" cy="314" rx="31" ry="27" fill="url(#yolk)"/><path d="M465 302q10-8 20-5" fill="none" stroke="#ffe2a1" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="#6f8559"><path d="m433 252 9-3 1 4-8 3Zm-69 59 8 3-2 4-8-3Zm147-23 7-4 2 4-7 4Zm-64 67 9 1v4l-9-2Zm-62-141 8 2-1 3-8-2Z"/></g>
  <!-- A bowl of rice sits behind the plate. -->
  <g transform="translate(587 137)" filter="url(#shadow)">
    <path d="M-73 0q4 67 46 79h54Q69 65 73 0Z" fill="url(#bowl)"/>
    <ellipse rx="77" ry="49" fill="#e9e3d1"/><ellipse cy="-4" rx="67" ry="41" fill="#f9f3e3"/>
    <path d="M-57-6q-10-18 11-23 7-15 26-7 13-15 29-4 23-8 29 8 24-1 21 19 13 15-5 23-20 18-46 12-26 10-47-2-19-2-18-26Z" fill="#fffbeb"/>
    <g opacity=".95"><use href="#grain" transform="translate(-39 -12) rotate(35)"/><use href="#grain" transform="translate(-24 -26) rotate(-25)"/><use href="#grain" transform="translate(-9 -14) rotate(70)"/><use href="#grain" transform="translate(7 -30) rotate(22)"/><use href="#grain" transform="translate(22 -18) rotate(-40)"/><use href="#grain" transform="translate(42 -8) rotate(17)"/><use href="#grain" transform="translate(28 7) rotate(45)"/><use href="#grain" transform="translate(8 14) rotate(-15)"/><use href="#grain" transform="translate(-12 4) rotate(75)"/><use href="#grain" transform="translate(-34 10) rotate(12)"/><use href="#grain" transform="translate(-45 -1) rotate(-60)"/><use href="#grain" transform="translate(2 -2) rotate(10)"/><use href="#grain" transform="translate(46 13) rotate(40)"/></g>
    <path d="M-19 78h38" stroke="#c4bea8" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Milk in clear glass, keeping the ingredient itself visible. -->
  <g transform="translate(190 142)" filter="url(#shadow)">
    <path d="M-43-14h86l-7 110q-35 17-72 0Z" fill="url(#cup)" stroke="#b1c2ac" stroke-width="2"/>
    <path d="M-39 4h78l-6 89q-33 13-65 0Z" fill="#f5f0dc"/>
    <ellipse cy="4" rx="39" ry="13" fill="#fff9e7"/>
    <ellipse cy="-14" rx="44" ry="16" fill="#e7ebd9" fill-opacity=".6" stroke="#c7d2bd" stroke-width="2"/>
    <path d="m-30-5 4 88" stroke="#fffcf0" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="rotate(12 657 336)" fill="#9b9178" filter="url(#small)"><path d="M650 244h7v187q-3 7-7 0Z"/><ellipse cx="653" cy="227" rx="12" ry="24" fill="#b1a68a"/><path d="M683 211h5v220q-3 7-6 0Z"/></g>
  <path d="M101 410q12-35 40-26-2 33-40 26Z" fill="#7b9365"/><path d="M103 411q32-12 48 8-21 23-48-8Z" fill="#93a577"/>
</svg>
