<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="외출 가방 옆에 챙겨 둔 물병">
  <title>물병과 가방을 챙기는 가벼운 외출 준비</title>
