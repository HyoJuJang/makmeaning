    <path d="m148 35 4 12q25 7 49 0l5-12Z" fill="#c5ad7d"/>
    <ellipse cx="177" cy="35" rx="29" ry="5" fill="#d9c59c"/>
    <path d="m155 37 3 10m9-9 2 10m10-10v11m11-11-2 10m10-12-2 11" stroke="#a89062" stroke-width="1.2" opacity=".7"/>
  </g>
  <!-- Wood pantry, with enough visual space for an independent purchase pin. -->
  <g filter="url(#shadow)">
    <path d="M594 51h108v191H594Z" fill="#a38259"/>
    <path d="M601 59h94v176h-94Z" fill="#c4a475"/>
    <path d="M603 61h90v43h-90Zm0 49h90v46h-90Z" fill="#b5976c"/>
    <path d="M594 104h108v7H594Zm0 51h108v7H594Z" fill="#dfc395"/>
