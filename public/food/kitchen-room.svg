    <path d="M256 180h98v50h-98ZM361 180h99v50h-99ZM467 180h100v50H467Z" fill="#a9b498" stroke="#859674" stroke-width="1.4"/>
    <path d="M360 200h99M295 188h19M400 188h20M505 188h20M400 209h20" stroke="#6f7e60" stroke-width="3" stroke-linecap="round"/>
