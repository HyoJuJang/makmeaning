    <rect x="612" y="79" width="26" height="24" rx="4" fill="#e1dbc3"/><rect x="610" y="75" width="30" height="6" rx="2" fill="#8e9b7e"/>
    <rect x="651" y="68" width="29" height="35" rx="5" fill="#d9cdb1"/><rect x="649" y="64" width="33" height="6" rx="2" fill="#a38862"/>
    <path d="M616 136q16-6 33 0l-4 16h-24Z" fill="#e9e6d5"/><ellipse cx="632" cy="135" rx="17" ry="4" fill="#f7f1df"/>
    <path d="M657 124h24v27h-24Z" fill="#80947b"/><path d="M680 129q12-3 11 7-1 8-11 5" fill="none" stroke="#80947b" stroke-width="4"/>
  </g>
  <!-- Plants frame the useful surfaces rather than covering them. -->
  <ellipse cx="77" cy="240" rx="31" ry="7" fill="#8b8f69" opacity=".13"/>
  <path d="M60 207h35l-5 30q-13 7-25 0Z" fill="#b49169"/><ellipse cx="77" cy="207" rx="18" ry="5" fill="#c6ab80"/>
  <path d="M77 207v-47m0 34-14-15m14 4 14-22m-14 9-10-15" stroke="#72866b" stroke-width="2.5" fill="none"/>
  <use href="#leaf" transform="translate(77 178) rotate(-15)"/><use href="#leaf" transform="translate(77 193) rotate(110)"/><use href="#leaf" transform="translate(69 161) rotate(-8) scale(.85)"/><use href="#leaf" transform="translate(85 172) rotate(120) scale(.9)"/>
  <path d="M532 141h21l-3 15h-15Z" fill="#bc956e"/>
  <path d="M543 142v-23m0 11-8-8m8 5 7-11" stroke="#728768" stroke-width="2" fill="none"/>
  <use href="#leaf" transform="translate(543 132) scale(.45)"/><use href="#leaf" transform="translate(543 125) rotate(110) scale(.43)"/>
  <!-- A soft runner carries the warm room palette to the foreground. -->
  <path d="m276 255 270 0 29 28H251Z" fill="#b5baa0" opacity=".68"/>
  <path d="m283 260 258 0m-277 18h298" stroke="#e5e4cd" stroke-width="3" opacity=".76"/>
  <path d="M731 0v58" stroke="#9d8c70" stroke-width="2"/><path d="m712 56 38 0 13 26h-64Z" fill="#c8b38c"/><ellipse cx="731" cy="82" rx="32" ry="5" fill="#ece0b9"/>
</svg>
