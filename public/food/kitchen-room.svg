  <ellipse cx="451" cy="156" rx="33" ry="4" fill="#aebcaf"/>
  <path d="M466 153v-21q0-11-10-11t-10 10v3" fill="none" stroke="#849285" stroke-width="5" stroke-linecap="round"/>
  <path d="M466 150h10" stroke="#697b6c" stroke-width="3" stroke-linecap="round"/>
  <path d="M288 143q-6-8-5-18h31q2 15-6 22h-17Z" fill="#ede8d5" stroke="#c4c7b2"/>
  <path d="M311 127q17-2 14 9-2 7-13 4" fill="none" stroke="#bcc3ad" stroke-width="4"/>
  <path d="M286 123q12-11 25 0" fill="none" stroke="#70876b" stroke-width="4"/>
