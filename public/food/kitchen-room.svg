<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="햇살이 드는 아늑한 주방">
  <title>냉장고와 나무 선반, 작은 식물이 있는 나의 주방</title>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f4efdf"/><stop offset="1" stop-color="#e6e0cd"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#d6bd98"/><stop offset="1" stop-color="#e8d5b3"/></linearGradient>
    <linearGradient id="fridge" x2="1" y2="0"><stop stop-color="#adbba3"/><stop offset=".7" stop-color="#ccd4ba"/><stop offset="1" stop-color="#bac7ae"/></linearGradient>
    <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#cba778"/><stop offset="1" stop-color="#ae895e"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#d1dfcd"/><stop offset="1" stop-color="#e9ecda"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fffce6" stop-opacity=".8"/><stop offset="1" stop-color="#fffce6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#615a3d" flood-opacity=".16"/></filter>
    <pattern id="tiles" width="41" height="28" patternUnits="userSpaceOnUse"><rect width="41" height="28" fill="#ececdf"/><path d="M0 27.5h41M40.5 0v28" stroke="#dbdece" stroke-width="1"/></pattern>
    <g id="leaf"><path d="M0 0C-17-1-24-12-23-21-9-23 1-12 0 0Z" fill="#7a966b"/><path d="m-2-2-14-13" fill="none" stroke="#9aae7e" stroke-width="1.1"/></g>
  </defs>
  <rect width="800" height="300" fill="url(#wall)"/>
  <path d="M0 0h45v232L0 266Z" fill="#ddd6bf"/>
  <path d="M755 0h45v266l-45-34Z" fill="#e0dac5"/>
  <path d="M45 232h710l45 34v34H0v-34Z" fill="url(#floor)"/>
  <path d="M45 233h710" stroke="#bba783" stroke-width="5"/>
  <g stroke="#bd9b70" stroke-opacity=".23" stroke-width="1.2"><path d="M0 268h800M0 294h800M185 233l-28 67M348 233l-7 67M511 233l16 67M674 233l37 67M87 267v27M255 267l-3 27M427 267l1 27M603 267l7 27"/></g>
  <ellipse cx="396" cy="177" rx="295" ry="218" fill="url(#sun)"/>
  <path d="m365 52 119 3 141 188H456Z" fill="#fff9d8" opacity=".33"/>
  <!-- The central window and counter keep the room open between the two storage areas. -->
  <g filter="url(#shadow)">
    <rect x="328" y="29" width="177" height="108" rx="3" fill="#bca57e"/>
    <rect x="334" y="35" width="165" height="96" fill="url(#glass)"/>
    <path d="M335 91q39-44 72-14t92-19v71H335Z" fill="#bccda9" opacity=".54"/>
    <path d="M335 115q34-25 73-10t91-11v37H335Z" fill="#a4b88e" opacity=".43"/>
    <path d="M414 35v96M334 82h165" stroke="#f9f3df" stroke-width="6"/>
    <rect x="322" y="131" width="189" height="7" rx="2" fill="#d2b98e"/>
    <path d="M329 33h15v97h-9Z" fill="#fcf6e6" fill-opacity=".81"/>
    <path d="M489 33h13l-3 97h-17Z" fill="#fcf6e6" fill-opacity=".78"/>
  </g>
  <rect x="250" y="139" width="331" height="29" fill="url(#tiles)"/>
