<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#F7F5EE"><title>G:Scene — 민서의 공간</title><link rel="stylesheet" href="/style.css"></head><body><main id="app" data-home-state="loading" aria-busy="true"><header><a class="brand" href="/" aria-label="G Scene 홈">G:Scene<span class="brand-dot"></span></a><span class="partner">with <b>GS SHOP</b></span></header><section class="intro"><h1>나의 작은 일상<span>.</span></h1><button id="avatar-picker" aria-haspopup="dialog" aria-label="캐릭터 바꾸기"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 17v-2a6 6 0 0 1 12 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>캐릭터</span></button><p class="intro-support">내가 고른 물건으로 채워지는 집</p></section><section class="home-section" aria-label="나의 연결된 원룸"><p class="touch-hint">바닥은 이동 · 가구는 사용</p><div class="house-wrap"><div id="home-load-state" class="home-load-state" role="status" aria-live="polite"><span class="loading-orbit" aria-hidden="true"></span><strong>나의 공간을 준비하고 있어요</strong><p>구매한 물건을 제자리에 놓는 중</p></div><div id="house"></div><div class="room-targets"><button data-object="bed" class="bed-target" aria-label="침대에 눕기"></button><button data-object="window" class="window-target" aria-label="창문 열기"></button><button data-room="fashion" class="room-target fashion" aria-label="Fashion 옷장 열기"></button><button type="button" data-room="fashion" class="room-category-link fashion-link" aria-label="Fashion 옷장 사용">Fashion</button><button data-room="food" class="room-target food" aria-label="Food 냉장고 열기"><span>Food</span></button><button data-room="living" class="room-target living" aria-label="Living 소파에 앉기"></button><button type="button" data-room="living" class="room-category-link living-link" aria-label="Living 소파 사용">Living</button><button data-room="beauty" class="room-target beauty" aria-label="Beauty 화장대 열기"><span>Beauty</span></button><button data-room="food" data-target="pantry" class="pantry-target" aria-label="Food 팬트리 사용"></button><button data-room="living" data-target="lamp" class="lamp-target" aria-label="스탠드 조명 켜기 또는 끄기"></button></div></div></section><footer><span>실상품과 연결한 가상 구매·보유 데모</span><button id="reset">데모 초기화 <span>↺</span></button></footer><p class="sr-only" role="status" aria-live="polite" id="status"></p></main><div id="tray-root"></div><div id="modal-root"></div><script type="module" src="/app.js"></script></body></html>
